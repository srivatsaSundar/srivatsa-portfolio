<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1200" height="630" fill="#000000"/>
    
    <!-- Abstract Node Network -->
    <g opacity="0.6">
        <!-- Lines -->
        <line x1="200" y1="150" x2="400" y2="300" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="400" y1="300" x2="350" y2="500" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="400" y1="300" x2="600" y2="200" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="600" y1="200" x2="800" y2="350" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="800" y1="350" x2="700" y2="550" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="800" y1="350" x2="1000" y2="250" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="600" y1="200" x2="500" y2="100" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="350" y1="500" x2="650" y2="550" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="1000" y1="250" x2="950" y2="500" stroke="white" stroke-width="1" opacity="0.4"/>
        
        <!-- Nodes with Glow -->
        <g fill="white">
            <!-- Node 1 -->
            <circle cx="200" cy="150" r="4" />
            <circle cx="200" cy="150" r="15" fill-opacity="0.1" />
            
            <!-- Node 2 -->
            <circle cx="400" cy="300" r="5" />
            <circle cx="400" cy="300" r="20" fill-opacity="0.1" />
            
            <!-- Node 3 -->
            <circle cx="350" cy="500" r="3" />
            <circle cx="350" cy="500" r="12" fill-opacity="0.1" />
            
            <!-- Node 4 -->
            <circle cx="600" cy="200" r="6" />
            <circle cx="600" cy="200" r="25" fill-opacity="0.1" />
            
            <!-- Node 5 -->
            <circle cx="800" cy="350" r="4" />
            <circle cx="800" cy="350" r="18" fill-opacity="0.1" />
            
            <!-- Node 6 -->
            <circle cx="700" cy="550" r="3" />
            <circle cx="700" cy="550" r="10" fill-opacity="0.1" />
            
            <!-- Node 7 -->
            <circle cx="1000" cy="250" r="5" />
            <circle cx="1000" cy="250" r="22" fill-opacity="0.1" />

            <!-- Node 8 -->
            <circle cx="500" cy="100" r="3" />
            <circle cx="500" cy="100" r="12" fill-opacity="0.1" />

            <!-- Node 9 -->
            <circle cx="650" cy="550" r="4" />
            <circle cx="650" cy="550" r="15" fill-opacity="0.1" />
             
            <!-- Node 10 -->
            <circle cx="950" cy="500" r="3" />
            <circle cx="950" cy="500" r="12" fill-opacity="0.1" />
        </g>
    </g>
    
    <!-- Subtle Text (Optional, removed as per previous request for no text, but adding small copyright might be nice? No, sticking to "no text") -->
</svg>
